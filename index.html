<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Control Inteligente de Hábitos de Estudio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 8px; 
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        input, select, button {
            width: 100%;
            padding: 8px;
            margin: 8px 0 15px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #3498db;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }

        .result {
            margin-top: 20px;
            padding: 10px;
            background-color: #ecf0f1;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<header>
    <h1>App Inteligente de Hábitos de Estudio</h1>
</header>

<div class="container">
    <h2>Registro de Estudio</h2>

    <form id="studyForm">
        <label>¿Cuales son tus horas de estudio por día?:</label>
        <input type="number" id="hours" min="0" required>

        <label>Días de estudio por semana:</label>
        <input type="number" id="days" min="0" max="7" required>

        <label>Nivel de concentración (1-5):</label>
        <select id="focus" required>
            <option value="">Selecciona</option>
            <option value="1">1 - Muy baja</option>
            <option value="2">2 - Baja</option>
            <option value="3">3 - Media</option>
            <option value="4">4 - Alta</option>
            <option value="5">5 - Muy alta</option>
        </select>

        <button type="submit">Analizar hábito</button>
    </form>

    <div class="result">
        <h3>Resultado:</h3>
        <p id="level">Nivel actual: --</p>
        <p id="recommendation">Recomendación: --</p>
    </div>
</div>

<script>
document.getElementById("studyForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let hours = parseFloat(document.getElementById("hours").value);
    let days = parseFloat(document.getElementById("days").value);
    let focus = parseFloat(document.getElementById("focus").value);

    let score = (hours * days * focus) / 5;

    let level = "";
    let recommendation = "";

    if (score < 10) {
        level = "Bajo";
        recommendation = "Incrementa tus horas de estudio y elimina distracciones.";
    } else if (score < 25) {
        level = "Medio";
        recommendation = "Vas bien, pero puedes mejorar tu concentración y constancia.";
    } else {
        level = "Alto";
        recommendation = "Excelente hábito. Mantén tu disciplina.";
    }

    document.getElementById("level").innerText = "Nivel actual: " + level;
    document.getElementById("recommendation").innerText = "Recomendación: " + recommendation;
});
</script>

</body>
</html>
