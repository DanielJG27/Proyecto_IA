<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sugerencias Inteligentes de Estudio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f7;
            margin: 0;
        }

        header {
            background-color: #34495e;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        select, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #ecf0f1;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<header>
    <h1>Generador Inteligente de Sugerencias</h1>
</header>

<div class="container">

    <h2>Selecciona tu nivel de rendimiento</h2>

    <select id="nivel">
        <option value="">Selecciona</option>
        <option value="Bajo">Bajo</option>
        <option value="Medio">Medio</option>
        <option value="Alto">Alto</option>
    </select>

    <button onclick="generarSugerencias()">Generar Plan de Mejora</button>

    <div class="result">
        <h3>Plan Personalizado:</h3>
        <p id="estrategia"></p>
        <p id="tecnica"></p>
        <p id="horario"></p>
        <p id="meta"></p>
    </div>

</div>

<script>
function generarSugerencias() {

    let nivel = document.getElementById("nivel").value;

    let estrategia = "";
    let tecnica = "";
    let horario = "";
    let meta = "";

    if(nivel === "Bajo") {
        estrategia = "Debes estructurar un horario fijo y eliminar distracciones digitales.";
        tecnica = "Técnica Pomodoro (25 min estudio + 5 min descanso).";
        horario = "Estudia mínimo 1.5 horas diarias, 5 días a la semana.";
        meta = "Aumentar 30% tu tiempo efectivo de estudio en 2 semanas.";
    }
    else if(nivel === "Medio") {
        estrategia = "Optimiza tu concentración y aumenta constancia.";
        tecnica = "Método Active Recall y mapas mentales.";
        horario = "2-3 horas diarias, 5-6 días a la semana.";
        meta = "Subir tu nivel a alto en 3 semanas.";
    }
    else if(nivel === "Alto") {
        estrategia = "Mantén disciplina y enfócate en profundizar conocimientos.";
        tecnica = "Técnica Feynman y simulacros de examen.";
        horario = "Mantener rutina actual con revisión semanal.";
        meta = "Mejorar rendimiento académico en exámenes un 10%.";
    }
    else {
        alert("Selecciona un nivel primero");
        return;
    }

    document.getElementById("estrategia").innerText = "Estrategia: " + estrategia;
    document.getElementById("tecnica").innerText = "Técnica recomendada: " + tecnica;
    document.getElementById("horario").innerText = "Horario sugerido: " + horario;
    document.getElementById("meta").innerText = "Meta semanal: " + meta;
}
</script>

</body>
</html>
